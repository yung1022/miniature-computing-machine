name: Visit Link And Run Script

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to open before evaluating script.js"
        required: false
        default: "https://grinding.tnstats.dev/"
      local_storage_json:
        description: "JSON object of localStorage key/value pairs to set before script.js runs. Example: {\"theme\":\"dark\",\"settings\":{\"sound\":true}}"
        required: false
        default: "{}"

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visit page and run script.js
        env:
          TARGET_URL: ${{ inputs.target_url }}
          LOCAL_STORAGE_JSON: ${{ inputs.local_storage_json }}
        run: npm run run
